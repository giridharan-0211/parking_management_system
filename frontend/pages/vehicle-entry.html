<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vehicle Entry - Parking Management System</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <h2>Parking System</h2>
            </div>


            <nav class="sidebar-menu">

                <a href="dashboard.html" class="menu-item">
                    Dashboard
                </a>

                <a href="vehicle-entry.html" class="menu-item active">
                    Vehicle Entry
                </a>

                <a href="slots.html" class="menu-item">
                    Parking Slots
                </a>

                <a href="vehicle-exit.html" class="menu-item">
                    Vehicle Exit
                </a>

                <a href="history.html" class="menu-item">
                    Parking History
                </a>

            </nav>


            <div class="sidebar-footer">

                <a href="../index.html" class="logout-button">
                    Logout
                </a>

            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="top-header">

                <div>

                    <h1>Vehicle Entry</h1>

                </div>

            </header>


            <!-- Vehicle Content -->
            <section class="dashboard-content">


                <!-- Add Vehicle -->
                <div class="dashboard-section compact-form-section">

                    <div class="section-header">

                        <div>

                            <h2>Add Vehicle</h2>

                        </div>

                    </div>


                    <form id="vehicleForm">

                        <div class="form-grid">


                            <!-- Vehicle Number -->
                            <div class="form-group">

                                <label for="vehicleNumber">
                                    Vehicle Number
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>

                                <input
                                    type="text"
                                    id="vehicleNumber"
                                    placeholder="TN29AB1234"
                                    maxlength="10"
                                    style="text-transform: uppercase;"
                                    required
                                >

                                <p id="vehicleNumberMessage" class="field-message"></p>

                            </div>


                            <!-- Vehicle Type -->
                            <div class="form-group">

                                <label for="vehicleType">
                                    Vehicle Type
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>

                                <select id="vehicleType" required>

                                    <option value="">
                                        Select Vehicle Type
                                    </option>

                                    <option value="Bike">
                                        Bike
                                    </option>

                                    <option value="Auto">
                                        Auto
                                    </option>

                                    <option value="Car">
                                        Car
                                    </option>

                                    <option value="Van">
                                        Van
                                    </option>

                                    <option value="Truck">
                                        Truck
                                    </option>

                                    <option value="Bus">
                                        Bus
                                    </option>

                                </select>

                            </div>


                            <!-- Assign Parking Slot -->
                            <div class="form-group">

                                <label for="assignedSlot">
                                    Assign Parking Slot
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>

                                <select id="assignedSlot" required>

                                    <option value="">
                                        Select Parking Slot
                                    </option>

                                </select>

                            </div>


                            <!-- Owner Name -->
                            <div class="form-group">

                                <label for="ownerName">
                                    Owner Name
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>

                                <input
                                    type="text"
                                    id="ownerName"
                                    placeholder="Enter owner name"
                                    required
                                >

                            </div>


                            <!-- Contact Number -->
                            <div class="form-group">

                                <label for="contactNumber">
                                    Contact Number
                                    <span class="required-mark" aria-hidden="true">*</span>
                                </label>

                                <input
                                    type="text"
                                    id="contactNumber"
                                    placeholder="9876543210"
                                    inputmode="numeric"
                                    maxlength="10"
                                    oninput="this.value = this.value.replace(/\D/g, '')"
                                    required
                                >

                            </div>

                        </div>


                        <p id="vehicleMessage"></p>

                        <button
                            type="submit"
                            class="primary-button"
                        >
                            Add Vehicle
                        </button>

                    </form>

                </div>


                <!-- Vehicle List -->
                <div class="dashboard-section">

                    <div class="section-header">

                        <div>

                            <h2>Added Vehicles</h2>

                            <p>Vehicles Added in the system</p>

                        </div>

                    </div>


                    <div class="table-container">

                        <table>

                            <thead>

                                <tr>

                                    <th>ID</th>

                                    <th>Vehicle Number</th>

                                    <th>Vehicle Type</th>

                                    <th>Owner Name</th>

                                    <th>Contact Number</th>

                                    <th>Assigned Slot</th>

                                    <th>Actions</th>

                                </tr>

                            </thead>


                            <tbody id="vehicleTableBody">

                                <tr>

                                    <td
                                        colspan="7"
                                        style="text-align: center;"
                                    >
                                        Loading vehicles...
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>


            </section>

        </main>

    </div>


    <div id="vehicleConfirmModal" class="slot-confirm-modal" hidden>

        <div class="slot-confirm-backdrop" data-vehicle-confirm-cancel></div>

        <div
            class="slot-confirm-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="vehicleConfirmTitle"
        >

            <div id="vehicleConfirmIcon" class="slot-confirm-icon">?</div>

            <h2 id="vehicleConfirmTitle">Confirm action</h2>

            <p id="vehicleConfirmMessage"></p>

            <div class="slot-confirm-actions">

                <button type="button" class="slot-cancel-button" data-vehicle-confirm-cancel>
                    Cancel
                </button>

                <button type="button" class="slot-confirm-button" id="vehicleConfirmAction">
                    Confirm
                </button>

            </div>

        </div>

    </div>


    <script src="../js/script.js"></script>

    <script src="../js/vehicle-entry.js"></script>

</body>

</html>
