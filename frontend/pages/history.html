<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parking History - Parking Management System</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <h2>Parking System</h2>
            </div>

            <nav class="sidebar-menu">

                <a href="dashboard.html" class="menu-item">
                    Dashboard
                </a>

                <a href="vehicle-entry.html" class="menu-item">
                    Vehicle Entry
                </a>

                <a href="slots.html" class="menu-item">
                    Parking Slots
                </a>

                <a href="vehicle-exit.html" class="menu-item">
                    Vehicle Exit
                </a>

                <a href="history.html" class="menu-item active">
                    Parking History
                </a>

            </nav>

            <div class="sidebar-footer">

                <a href="../index.html" class="logout-button">
                    Logout
                </a>

            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Header -->
            <header class="top-header">

                <div>
                    <h1>Parking History</h1>
                    <p>View all vehicle entry and exit records</p>
                </div>
            </header>


            <!-- History Content -->
            <section class="dashboard-content">

                <div class="dashboard-section">

                    <div class="section-header">

                        <div>
                            <h2>Parking Records</h2>
                            <p>Complete history of parking activity</p>
                        </div>

                    </div>


                    <div id="historyMessage"></div>


                    <div class="table-container">

                        <table>

                            <thead>

                                <tr>
                                    <th>Vehicle Number</th>
                                    <th>Parking Slot</th>
                                    <th>Entry Time</th>
                                    <th>Exit Time</th>
                                    <th>Status</th>
                                </tr>

                            </thead>

                            <tbody id="historyTableBody">

                                <tr>
                                    <td colspan="5">
                                        Loading parking records...
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="../js/history.js"></script>

</body>

</html>
