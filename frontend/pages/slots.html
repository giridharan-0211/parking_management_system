<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parking Slots - Parking Management System</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <div class="app-container">


        <!-- ================= SIDEBAR ================= -->
     

        <aside class="sidebar">

            <div class="sidebar-header">

                <h2>Parking System</h2>

            </div>


            <nav class="sidebar-menu">

                <a href="dashboard.html" class="menu-item">
                    Dashboard
                </a>

                <a href="vehicle-entry.html" class="menu-item">
                    Vehicle Entry
                </a>

                <a href="slots.html" class="menu-item active">
                    Parking Slots
                </a>

                <a href="vehicle-exit.html" class="menu-item">
                    Vehicle Exit
                </a>

                <a href="history.html" class="menu-item">
                    Parking History
                </a>

            </nav>


            <div class="sidebar-footer">

                <a href="../index.html" class="logout-button">
                    Logout
                </a>

            </div>

        </aside>



        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content">


            <!-- Header -->

            <header class="top-header">

                <div>


                    <h1>Parking Slots</h1>

                    <p>Manage parking slots</p>

                </div>

            </header>



            <!-- ================= CONTENT ================= -->

            <section class="dashboard-content">


                <!-- ADD SLOT -->

                <div class="dashboard-section compact-form-section">


                    <div class="section-header">

                        <div>

                            <h2>Add New Parking Slot</h2>

                        </div>

                    </div>



                    <form id="slotForm">


                        <div class="form-grid">


                            <!-- Slot Number -->

                            <div class="form-group">

                                <label for="slotNumber">

                                    Slot Number

                                </label>


                                <input
                                    type="text"
                                    id="slotNumber"
                                    placeholder="A-0000"
                                    maxlength="6"
                                    pattern="[A-Z]-[0-9]{2,4}"
                                    required
                                >

                            </div>


                        </div>



                        <button
                            type="submit"
                            class="primary-button"
                        >

                            Add Slot

                        </button>


                        <p id="slotMessage"></p>


                    </form>


                </div>

                <div class="dashboard-section">

                    <div class="section-header">

                        <div>

                            <h2>All Parking Slots</h2>

                            <p>View availability and manage every parking slot</p>

                        </div>

                    </div>

                    <div id="slotGrid" class="slot-grid">

                        <p>Loading parking slots...</p>

                    </div>

                </div>



            </section>


        </main>


    </div>



    <div id="slotConfirmModal" class="slot-confirm-modal" hidden>

        <div class="slot-confirm-backdrop" data-confirm-cancel></div>

        <div
            class="slot-confirm-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="slotConfirmTitle"
        >

            <div id="slotConfirmIcon" class="slot-confirm-icon" aria-hidden="true">?</div>

            <h2 id="slotConfirmTitle">Confirm action</h2>

            <p id="slotConfirmMessage"></p>

            <div class="slot-confirm-actions">

                <button type="button" class="slot-cancel-button" data-confirm-cancel>
                    Cancel
                </button>

                <button type="button" class="slot-confirm-button" id="slotConfirmAction">
                    Confirm
                </button>

            </div>

        </div>

    </div>


    <!-- JavaScript -->

    <script src="../js/script.js"></script>

    <script src="../js/slots.js"></script>


</body>

</html>
