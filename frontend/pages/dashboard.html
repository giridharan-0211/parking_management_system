<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Parking Management System</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <!-- Main Application Container -->
    <div class="app-container">


        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-header">

                <h2>Parking System</h2>

            </div>


            <nav class="sidebar-menu">

                <a href="dashboard.html" class="menu-item active">
                    Dashboard
                </a>

                <a href="vehicles.html" class="menu-item">
                    Vehicles
                </a>

                <a href="slots.html" class="menu-item">
                    Parking Slots
                </a>

                <a href="entry-exit.html" class="menu-item">
                    Entry / Exit
                </a>

                <a href="history.html" class="menu-item">
                    Parking History
                </a>

            </nav>


            <div class="sidebar-footer">

                <a href="../index.html" class="logout-button">
                    Logout
                </a>

            </div>

        </aside>



        <!-- Main Content -->
        <main class="main-content">


            <!-- Header -->
            <header class="top-header">

                <div>

                    <h1>Dashboard</h1>

                    <p>Parking management overview</p>

                </div>


                <div class="admin-info">

                    <span>Admin</span>

                </div>

            </header>



            <!-- Dashboard Content -->
            <section class="dashboard-content">


                <!-- Statistics Cards -->
                <div class="stats-grid">


                    <!-- Total Slots -->
                    <div class="stat-card">

                        <div class="stat-info">

                            <p>Total Parking Slots</p>

                            <h2 id="totalSlots">100</h2>

                        </div>

                    </div>


                    <!-- Available Slots -->
                    <div class="stat-card">

                        <div class="stat-info">

                            <p>Available Slots</p>

                            <h2 id="availableSlots">70</h2>

                        </div>

                    </div>


                    <!-- Occupied Slots -->
                    <div class="stat-card">

                        <div class="stat-info">

                            <p>Occupied Slots</p>

                            <h2 id="occupiedSlots">30</h2>

                        </div>

                    </div>


                    <!-- Currently Parked -->
                    <div class="stat-card">

                        <div class="stat-info">

                            <p>Currently Parked</p>

                            <h2 id="parkedVehicles">30</h2>

                        </div>

                    </div>


                </div>

                <div class="dashboard-section">

                    <div class="section-header">

                        <div>

                            <h2>Parking Slots</h2>

                            <p>Available and occupied parking slots</p>

                        </div>

                    </div>


                    <div id="dashboardSlotGrid" class="slot-grid">

                        <p>Loading parking slots...</p>

                    </div>

                </div>

            </section>


        </main>


    </div>


    <script src="../js/script.js"></script>

</body>

</html>
